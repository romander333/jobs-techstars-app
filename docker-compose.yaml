services:
  postgres:
    image: postgres:15
    container_name: jobs_postgres
    environment:
      POSTGRES_DB: ${JOBS_DB_NAME:-jobs}
      POSTGRES_USER: ${JOBS_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${JOBS_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOBS_USERNAME:-postgres} -d ${JOBS_DB_NAME:-jobs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: jobs_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${JOBS_DB_NAME:-jobs}
      SPRING_DATASOURCE_USERNAME: ${JOBS_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${JOBS_PASSWORD:-postgres}

volumes:
  postgres_data: